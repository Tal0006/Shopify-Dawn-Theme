# Post-purchase feedback survey on the Thank you page (ordering and site experience only).
# Checkout UI extension (Polaris web components + Preact), API version 2026-10.
api_version = "2026-10"

[[extensions]]
name = "Post-purchase feedback"
description = "A short optional survey on the Thank you page, sent to the Fankee backend."
handle = "post-purchase-feedback"
uid = "e33bfbb4-0dac-e0ef-6805-c90d046d84b91ff747e0"
type = "ui_extension"

  # Thank you page only. The order status page is not targeted, so a submitted survey is never asked again there.
  [[extensions.targeting]]
  module = "./src/ThankYou.tsx"
  target = "purchase.thank-you.block.render"

  [extensions.capabilities]
  # fetch() to the Fankee backend (https://fankee-group-delivery.onrender.com) with a Shopify session token.
  network_access = true
  # No Storefront API access is needed.
  api_access = false

  # No merchant settings. A Google review request is deliberately not part of the Thank you page: customers
  # haven't received their products yet. It will be a separate feature, sent after confirmed delivery.
